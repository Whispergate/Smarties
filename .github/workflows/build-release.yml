name: Build & Release Smarties

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dotnet:
    name: Build .NET Assembly
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build self-contained (win-x64)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts/dotnet

      - name: Upload .NET artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarties-dotnet-win-x64
          path: artifacts/dotnet/smarties.exe

  build-bof:
    name: Build BOF (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build BOF
        working-directory: bof
        run: make

      - name: Verify COFF object
        working-directory: bof
        run: |
          file smarties.x64.o
          x86_64-w64-mingw32-objdump -t smarties.x64.o | grep -q ' go$' && echo "[+] Entry point 'go' found" || (echo "[-] Missing 'go' symbol" && exit 1)

      - name: Upload BOF artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarties-bof-x64
          path: bof/smarties.x64.o

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-dotnet, build-bof]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release

          cp artifacts/smarties-dotnet-win-x64/smarties.exe release/smarties-dotnet-win-x64.exe
          cp artifacts/smarties-bof-x64/smarties.x64.o release/smarties.x64.o

          cd release
          zip -qr smarties-bundle.zip smarties-dotnet-win-x64.exe smarties.x64.o
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Smarties build ${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
            --prerelease \
            --generate-notes
